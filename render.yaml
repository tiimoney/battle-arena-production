services:
  - type: web
    name: mocheso-league
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build && npx prisma migrate deploy --schema=server/prisma/schema.prisma
    startCommand: npm run start --workspace server
    envVars:
      - key: NODE_ENV
        value: production
      # Pooled Neon connection string (the app's normal query traffic).
      - key: DATABASE_URL
        sync: false
      # Unpooled Neon connection string (schema migrations need this -- pgbouncer's
      # transaction pooling mode doesn't support the advisory locks `prisma migrate`
      # takes).
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Resend (resend.com) API key for sending verification emails. Leave unset and
      # verification links just get logged server-side instead of emailed.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Mocheso League <onboarding@resend.dev>"
      # PUBLIC_API_URL / CLIENT_ORIGIN are intentionally omitted: server/src/config.ts
      # falls back to Render's auto-injected RENDER_EXTERNAL_URL, which is exactly
      # right for this combined single-service deployment.
